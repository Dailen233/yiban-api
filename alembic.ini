[alembic]
# 迁移脚本目录
script_location = alembic
# 使项目根目录可导入（config、models、core 等）
prepend_sys_path = .
# sqlalchemy.url 不在本文件配置：由 alembic/env.py 从项目 config 读取
# 同一套显式数据库配置（DATABASE_URL），保证迁移与运行时一致。

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
