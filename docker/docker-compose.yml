# FastAPI starter — 最小可运行栈：app + MySQL（+ 可选 Redis）
#
# 在项目根目录执行：
#   # 默认：app + MySQL（缓存走内存，不启 Redis）
#   docker compose -f docker/docker-compose.yml up --build
#
#   # 启用可选 Redis：
#   REDIS_HOST=redis docker compose -f docker/docker-compose.yml --profile redis up --build
#
# 访问：http://localhost:8000/docs

name: fastapi-starter

networks:
  app-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

services:
  mysql:
    image: mysql:8.0
    container_name: fastapi-starter-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-api_security_demo}
      MYSQL_USER: ${MYSQL_USER:-dev_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 尚未设计业务 DDL，不挂载教师示例数据库初始化脚本。
      # - ../database/<reviewed-init-script>.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # 可选：docker compose --profile redis up
  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    container_name: fastapi-starter-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fastapi-starter-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # docker 别名映射到 development（保留 /docs）；见 config/config_factory.py
      FASTAPI_ENV: ${FASTAPI_ENV:-docker}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-docker-min-32-chars-please}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-dev_user}:${MYSQL_PASSWORD:-123456}@mysql:3306/${MYSQL_DATABASE:-api_security_demo}?charset=utf8mb4
      # 未启用 Redis 时留空 → 应用回退内存缓存
      # 启用：REDIS_HOST=redis ... --profile redis up
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: "6379"
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ../logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
    networks:
      - app-net
