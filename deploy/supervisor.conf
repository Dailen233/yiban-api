"""Supervisor配置文件"""

[program:fastapi_security]
command=/path/to/your/venv/bin/python /path/to/your/project/start.py
directory=/path/to/your/project
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/fastapi_security.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PATH="/path/to/your/venv/bin"
