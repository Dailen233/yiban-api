# =============================================================================
# Prometheus告警规则配置
# =============================================================================

groups:
  - name: fastapi_app_alerts
    rules:
      # 应用响应时间告警
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="fastapi-app"}[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "FastAPI应用响应时间过高"
          description: "FastAPI应用95%响应时间超过1秒，当前值: {{ $value }}秒"

      # 应用错误率告警
      - alert: HighErrorRate
        expr: rate(http_requests_total{job="fastapi-app",status=~"5.."}[5m]) / rate(http_requests_total{job="fastapi-app"}[5m]) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FastAPI应用错误率过高"
          description: "FastAPI应用5xx错误率超过5%，当前值: {{ $value | humanizePercentage }}"

      # 应用服务不可用告警
      - alert: AppDown
        expr: up{job="fastapi-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "FastAPI应用服务不可用"
          description: "FastAPI应用服务已停止响应"

  - name: database_alerts
    rules:
      # 数据库连接数告警
      - alert: HighDatabaseConnections
        expr: mysql_global_status_threads_connected{job="mysql"} > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "MySQL连接数过高"
          description: "MySQL当前连接数: {{ $value }}"

      # 数据库服务不可用告警
      - alert: DatabaseDown
        expr: up{job="mysql"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "MySQL数据库服务不可用"
          description: "MySQL数据库服务已停止响应"

  - name: redis_alerts
    rules:
      # Redis内存使用率告警
      - alert: HighRedisMemoryUsage
        expr: (redis_memory_used_bytes{job="redis"} / redis_memory_max_bytes{job="redis"}) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis内存使用率过高"
          description: "Redis内存使用率超过80%，当前值: {{ $value | humanizePercentage }}"

      # Redis服务不可用告警
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis服务不可用"
          description: "Redis服务已停止响应"

  - name: system_alerts
    rules:
      # CPU使用率告警
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "系统CPU使用率过高"
          description: "CPU使用率超过80%，当前值: {{ $value | humanizePercentage }}"

      # 内存使用率告警
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "系统内存使用率过高"
          description: "内存使用率超过85%，当前值: {{ $value | humanizePercentage }}"

      # 磁盘空间告警
      - alert: HighDiskUsage
        expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"}) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "磁盘空间不足"
          description: "根目录磁盘使用率超过85%，当前值: {{ $value | humanizePercentage }}"
