# =============================================================================
# Logstash pipeline配置 - FastAPI日志处理
# =============================================================================

input {
  # 文件输入 - FastAPI应用日志
  file {
    path => "/app/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/tmp/sincedb_fastapi"
    codec => "json"
    tags => ["fastapi", "application"]
  }
  
  # 文件输入 - Nginx访问日志
  file {
    path => "/var/log/nginx/access.log"
    start_position => "beginning"
    sincedb_path => "/tmp/sincedb_nginx_access"
    tags => ["nginx", "access"]
  }
  
  # 文件输入 - Nginx错误日志
  file {
    path => "/var/log/nginx/error.log"
    start_position => "beginning"
    sincedb_path => "/tmp/sincedb_nginx_error"
    tags => ["nginx", "error"]
  }
  
  # Beats输入
  beats {
    port => 5044
  }
}

filter {
  # 处理FastAPI日志
  if "fastapi" in [tags] {
    # 已经是JSON格式，直接解析时间戳
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    
    # 添加字段映射
    mutate {
      add_field => { "service" => "fastapi" }
      add_field => { "environment" => "${FASTAPI_ENV:development}" }
    }
    
    # 解析级别
    if [level] {
      mutate {
        lowercase => [ "level" ]
      }
    }
  }
  
  # 处理Nginx访问日志
  if "nginx" in [tags] and "access" in [tags] {
    grok {
      match => { 
        "message" => '%{IPORHOST:remote_addr} - %{DATA:remote_user} \[%{HTTPDATE:time_local}\] "%{WORD:method} %{URIPATHPARAM:request_uri} HTTP/%{NUMBER:http_version}" %{NUMBER:status} %{NUMBER:body_bytes_sent} "%{DATA:http_referer}" "%{DATA:http_user_agent}"'
      }
    }
    
    date {
      match => [ "time_local", "dd/MMM/yyyy:HH:mm:ss Z" ]
    }
    
    mutate {
      convert => { "status" => "integer" }
      convert => { "body_bytes_sent" => "integer" }
      add_field => { "service" => "nginx" }
      add_field => { "log_type" => "access" }
    }
  }
  
  # 处理Nginx错误日志
  if "nginx" in [tags] and "error" in [tags] {
    grok {
      match => { 
        "message" => '%{DATESTAMP:timestamp} \[%{DATA:level}\] %{NUMBER:pid}#%{NUMBER:tid}: (\*%{NUMBER:connection_id} )?%{GREEDYDATA:message}'
      }
      overwrite => [ "message" ]
    }
    
    mutate {
      add_field => { "service" => "nginx" }
      add_field => { "log_type" => "error" }
    }
  }
  
  # 通用字段处理
  mutate {
    add_field => { "[@metadata][index]" => "fastapi-logs-%{+YYYY.MM.dd}" }
  }
  
  # 移除不需要的字段
  mutate {
    remove_field => [ "host", "agent", "ecs", "log", "input" ]
  }
}

output {
  # 输出到Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index]}"
    template_name => "fastapi-logs"
    template_pattern => "fastapi-logs-*"
    template => {
      "settings" => {
        "number_of_shards" => 1
        "number_of_replicas" => 0
        "index.refresh_interval" => "5s"
      }
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" }
          "level" => { "type" => "keyword" }
          "message" => { "type" => "text", "analyzer" => "standard" }
          "service" => { "type" => "keyword" }
          "environment" => { "type" => "keyword" }
          "status" => { "type" => "integer" }
          "method" => { "type" => "keyword" }
          "request_uri" => { "type" => "keyword" }
          "remote_addr" => { "type" => "ip" }
        }
      }
    }
  }
  
  # 调试输出
  stdout {
    codec => rubydebug
  }
}
