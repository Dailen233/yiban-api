# 由 SQL-to-FastAPI-Scaffold 生成。
# 包管理与启动推荐使用 uv（https://github.com/astral-sh/uv）
#
# 占位符（生成时替换）：
#   yiban-api         — 项目名（PEP 503：建议用连字符，如 fastapi_project_starter）
#   译伴双语电子书生成系统共享后端起步工程  — 项目描述

[project]
name = "yiban-api"
version = "0.1.0"
description = "译伴双语电子书生成系统共享后端起步工程"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
    "greenlet>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[tool.uv]
# 应用型脚手架（非可发布库）：不打包安装项目本身，用 uv run 在环境中执行
package = false
# 默认同步时安装 dev 依赖组，便于测试
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
